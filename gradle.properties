org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- AdMob ----
# false = IDs de PRUEBA de Google. true = IDs reales de tu cuenta (rellena los de abajo y registra tu teléfono en testDevices).
admob.real=true
# Versión que tienes en "Test apps" de AdMob. Con IDs reales, SOLO esa versión usa los reales (modo de prueba).
# Cualquier otra versión usa automáticamente los IDs de demostración de Google (seguro). Déjalo vacío al publicar.
admob.testVersion=0.5.19
# ID de la aplicación: ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN (AdMob → Aplicaciones → Flux → Configuración de la app)
admob.appId=ca-app-pub-1606166306234066~4304215583
# IDs de bloque: ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN
admob.rewardedDownload=ca-app-pub-1606166306234066/1201423995
admob.rewardedVaultUnlock=ca-app-pub-1606166306234066/2981409522
admob.rewardedVaultSlot=ca-app-pub-1606166306234066/4387532525
admob.bannerHome=ca-app-pub-1606166306234066/7975102943
admob.bannerProgress=ca-app-pub-1606166306234066/3967188139
# IDs de tus dispositivos de prueba separados por coma (salen en Logcat al correr la app con el SDK)
admob.testDevices=
